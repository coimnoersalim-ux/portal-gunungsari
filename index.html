<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi - Desa Gunungsari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Font Premium: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Animasi Latar Belakang */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        /* Animasi Muncul Halus */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen relative overflow-x-hidden selection:bg-indigo-500/30">

    <!-- Latar Belakang Cahaya Bergerak (Mesh Gradient) -->
    <div class="fixed top-0 left-0 w-full h-full z-0 pointer-events-none flex justify-center items-center overflow-hidden opacity-60">
        <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-indigo-300 rounded-full mix-blend-multiply filter blur-[80px] animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[30rem] h-[30rem] bg-teal-300 rounded-full mix-blend-multiply filter blur-[80px] animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-[20%] w-[30rem] h-[30rem] bg-blue-300 rounded-full mix-blend-multiply filter blur-[80px] animate-blob animation-delay-4000"></div>
    </div>

    <div class="relative z-10 max-w-6xl mx-auto px-6 py-12">
        
        <!-- Bagian Header -->
        <div class="text-center mb-16 fade-in-up" style="animation-delay: 0.1s;">
            <!-- Lencana Status -->
            <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur-md text-indigo-700 text-sm font-bold px-5 py-2 rounded-full mb-8 border border-white shadow-sm hover:shadow-md transition-shadow cursor-default">
                <span class="flex h-3 w-3 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                Sistem Internal Perangkat Desa
            </div>
            
            <div class="flex justify-center mb-6">
                <div class="relative inline-flex items-center justify-center w-24 h-24 bg-white rounded-3xl shadow-xl border border-white/50 transform -rotate-3 hover:rotate-0 transition-transform duration-300">
                    <span class="text-5xl drop-shadow-sm">🏛️</span>
                </div>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-slate-900 tracking-tight drop-shadow-sm">
                Portal <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-teal-500">Gunungsari</span>
            </h1>
            <p class="text-slate-600 max-w-xl mx-auto text-lg leading-relaxed">
                Pusat akses layanan digital terpadu untuk efisiensi operasional dan administrasi Pemerintahan Desa.
            </p>
        </div>

        <!-- Wadah Kartu Aplikasi -->
        <div id="aplikasi-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-10">
            <!-- Kartu otomatis dibuat oleh JavaScript -->
        </div>

        <!-- Bagian Footer -->
        <div class="mt-12 pt-8 border-t border-slate-200/50 text-center text-sm text-slate-500 fade-in-up" style="animation-delay: 0.8s;">
            <p class="font-medium">© 2026 Pemerintahan Desa Gunungsari</p>
            <p class="mt-1">Dikelola oleh Kasipem & Operator Desa</p>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- SCRIPT DATA APLIKASI -->
    <!-- ======================================================= -->
    <script>
        const daftarAplikasi = [
            {
                nama: "SIPERTA",
                deskripsi: "Manajemen data kepemilikan dan pemetaan klasifikasi lahan desa.",
                link: "https://siperta-desa-gunungsari.vercel.app/",
                ikon: "🗺️", 
                warnaGlow: "group-hover:shadow-emerald-500/20",
                bgIkon: "bg-emerald-50 text-emerald-600"
            },
            {
                nama: "Sistem Kearsipan",
                deskripsi: "Database surat menyurat dan pencatatan arsip administrasi warga.",
                link: "https://script.google.com/macros/s/AKfycbyMXyYFHq3X5sZSq_OhI3JjBT78jn58DPJnda5ZcqgKnesvUD1aKMK1mHwo3ec1UHjZDA/exec",
                ikon: "📂",
                warnaGlow: "group-hover:shadow-blue-500/20",
                bgIkon: "bg-blue-50 text-blue-600"
            },
            {
                nama: "Dashboard Pelayanan",
                deskripsi: "Panel operator untuk memproses permohonan layanan satu pintu.",
                link: "MASUKKAN-LINK-APPSHEET-DISINI",
                ikon: "💻",
                warnaGlow: "group-hover:shadow-purple-500/20",
                bgIkon: "bg-purple-50 text-purple-600"
            },
            {
                nama: "Rekap PBB-P2",
                deskripsi: "Monitoring progres penagihan dan status pelunasan pajak.",
                link: "MASUKKAN-LINK-PBB-DISINI",
                ikon: "💳",
                warnaGlow: "group-hover:shadow-rose-500/20",
                bgIkon: "bg-rose-50 text-rose-600"
            },
            {
                nama: "Website Desa",
                deskripsi: "Situs publik resmi Pemerintah Desa Gunungsari, Cikatomas.",
                link: "https://gunungsari-tasikmalaya.desa.id/",
                ikon: "🌐",
                warnaGlow: "group-hover:shadow-indigo-500/20",
                bgIkon: "bg-indigo-50 text-indigo-600"
            },
            {
                nama: "Pendataan Indeks Desa",
                deskripsi: "Pendataan Indeks Desa Gunungsari",
                link: "https://script.google.com/macros/s/AKfycbxL6z6THc2gANgbd-R1IQScRI27M0L75bkF0fHexLvSGdlky30qUbNU5ADGLnyKB6FcWw/exec",
                ikon: "🏢",
                warnaGlow: "group-hover:shadow-indigo-500/20",
                bgIkon: "bg-indigo-50 text-indigo-600"
            }
        ];

        // Mesin Perender Kartu
        const container = document.getElementById('aplikasi-container');
        
        daftarAplikasi.forEach((app, index) => {
            const delay = 0.2 + (index * 0.1);
            
            const cardHTML = `
                <div class="fade-in-up h-full" style="animation-delay: ${delay}s;">
                    <a href="${app.link}" target="_blank" class="group relative flex flex-col h-full bg-white/70 backdrop-blur-xl border border-white shadow-lg ${app.warnaGlow} hover:shadow-2xl rounded-3xl p-7 transition-all duration-500 hover:-translate-y-2 overflow-hidden">
                        
                        <!-- Efek Hiasan Bulat di Sudut Kanan Atas -->
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-br from-white to-transparent rounded-full opacity-50 group-hover:scale-150 transition-transform duration-700 pointer-events-none"></div>

                        <div class="relative z-10 flex items-center justify-between mb-5">
                            <div class="flex-shrink-0 w-16 h-16 ${app.bgIkon} rounded-2xl flex items-center justify-center text-3xl shadow-sm border border-black/5 group-hover:scale-110 transition-transform duration-500">
                                ${app.ikon}
                            </div>
                            
                            <!-- Ikon Panah yang Muncul saat Hover -->
                            <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-indigo-600 group-hover:text-white shadow-sm transition-all duration-300">
                                <svg class="w-5 h-5 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="relative z-10 flex-grow">
                            <h3 class="text-xl font-bold text-slate-800 group-hover:text-indigo-600 mb-3 transition-colors duration-300">${app.nama}</h3>
                            <p class="text-sm font-medium text-slate-500 leading-relaxed">${app.deskripsi}</p>
                        </div>
                    </a>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    </script>
</body>
</html>
